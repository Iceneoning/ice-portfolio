<path d="M450 363 524 406 524 493 450 537 376 493 376 406Z" stroke="#ecffff" stroke-opacity=".5" stroke-width="1.5"/>
<path d="M450 338V562M353 394 547 506M547 394 353 506" stroke="#ddfbfb" stroke-opacity=".25" stroke-width="1.4"/>
<path d="M450 405 489 428V473L450 495 411 473V428Z" fill="#d9f9f6" fill-opacity=".13" stroke="#d9ffff" stroke-opacity=".7" stroke-width="2.4"/>
